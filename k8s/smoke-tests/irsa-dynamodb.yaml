apiVersion: v1
kind: Pod
metadata:
  name: irsa-dynamodb-smoke-test
spec:
  serviceAccountName: payment-orchestrator
  restartPolicy: Never
  containers:
    - name: aws-cli
      image: amazon/aws-cli:2.15.0
      command:
        - sh
        - -c
        - |
          echo "=== STS Identity ==="
          aws sts get-caller-identity
          echo "=== DynamoDB Tables ==="
          aws dynamodb list-tables --region us-east-1
